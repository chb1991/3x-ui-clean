name: Maintenance Script Safety Checks

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'install.sh'
      - 'update.sh'
      - 'tests/maintenance-smoke.sh'
      - '.github/workflows/safety-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-safety:
    name: Shell syntax and maintenance contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: |
          set -euo pipefail
          for script in scripts/install.sh scripts/update.sh scripts/backup.sh scripts/rollback.sh install.sh update.sh; do
            echo "Checking ${script}"
            bash -n "${script}"
          done
      - name: Ensure root and script entrypoints agree
        run: |
          set -euo pipefail
          cmp scripts/install.sh install.sh
          cmp scripts/update.sh update.sh
      - name: Exercise online WAL backup and failure guards (sandboxed fake service)
        run: sudo -E bash tests/maintenance-smoke.sh
      - name: Check fail-closed safety contracts
        run: |
          set -euo pipefail
          for script in scripts/update.sh scripts/rollback.sh scripts/install.sh; do
            grep -q 'CLEAN_SCRIPT_PROTOCOL=2' "${script}"
            grep -q 'XUI_STAGING_DIR:-/var/tmp' "${script}"
          done
          ! grep -q '/tmp/x-ui-update-stage' scripts/update.sh
          ! grep -q '/tmp/x-ui-rollback-' scripts/rollback.sh
          ! grep -q 'raw.githubusercontent.com/${CLEAN_REPO}/main/scripts/${sname}' scripts/update.sh
          grep -q 'Refusing unexpected stop of active VLESS/REALITY nodes' scripts/backup.sh
          grep -q 'Missing offline .sha256 sidecar' scripts/update.sh
